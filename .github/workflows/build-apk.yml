name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test native Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and test
        working-directory: mobile
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare ARM64 test APK
        run: cp mobile/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk Musica-para-los-Oidos-${GITHUB_REF_NAME}-arm64.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musica-para-los-Oidos-${{ github.ref_name }}-arm64
          path: Musica-para-los-Oidos-${{ github.ref_name }}-arm64.apk
          retention-days: 30

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Música para los Oídos ${{ github.ref_name }} — pruebas
          prerelease: true
          generate_release_notes: true
          files: Musica-para-los-Oidos-${{ github.ref_name }}-arm64.apk
          body: |
            APK Android nativo de pruebas, compilado desde Kotlin, Jetpack Compose y Media3.

            Este APK está firmado con la clave de depuración de Android; no es una versión de producción.
            La app reproduce archivos locales y no incluye rastreador ni descargador de YouTube.
