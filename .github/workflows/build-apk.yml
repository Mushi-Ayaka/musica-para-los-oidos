name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and sign release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"

      - name: Make Gradle wrapper executable
        run: chmod +x mobile/gradlew

      - name: Build, test and sign
        working-directory: mobile
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Prepare ARM64 release APK
        run: cp mobile/app/build/outputs/apk/release/app-arm64-v8a-release.apk Musica-para-los-Oidos-${GITHUB_REF_NAME}-arm64-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musica-para-los-Oidos-${{ github.ref_name }}-arm64-release
          path: Musica-para-los-Oidos-${{ github.ref_name }}-arm64-release.apk
          retention-days: 30

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Música para los Oídos ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: Musica-para-los-Oidos-${{ github.ref_name }}-arm64-release.apk
          body: |
            APK Android nativo (release, no debug) compilado desde Kotlin, Jetpack Compose y Media3.

            - Firmado con clave release propia.
            - Optimizado con R8 y reducción de recursos.
            - Reproduce archivos locales; sin rastreadores ni descargadores de YouTube.
